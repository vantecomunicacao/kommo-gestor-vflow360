name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend (typecheck, test, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Lint
        # Bloqueante desde 2026-08-06: Fase 2 do plano de remediação zerou os
        # ~340 erros/warnings originais nos arquivos Kommo-owned. GHL/legacy
        # (código morto, nunca deployado neste projeto) removido do repo em
        # 2026-08-13 — não há mais paths a excluir.
        run: npm run lint

  edge-functions:
    name: Edge functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          # Best-effort pin a recent stable Deno 2.x. Não há como confirmar a
          # versão exata do Supabase Edge Runtime a partir daqui — se o
          # comportamento divergir do hospedado, ajustar este pin.
          deno-version: "2.1.x"
      - name: Type-check edge functions
        # GHL/legacy (código morto, nunca deployado neste projeto) removido do
        # repo em 2026-08-13 — supabase/functions/ só tem Kommo daqui pra frente.
        run: |
          set -e
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            echo "deno check $dir index.ts"
            deno check "$dir/index.ts"
          done
      - name: Auth guardrail (verify_jwt=false ⇒ alguma autorização explícita)
        # Bloqueante desde 2026-08-08: a única pendência (pdf-extract, sem
        # nenhuma checagem de auth) foi removida junto com a function — ver
        # CLAUDE.md.
        run: node scripts/check-auth-guardrail.mjs
      - name: Unit tests (Deno)
        # Runner separado do vitest (que só enxerga src/). Lista de paths
        # explícita — atualizar conforme novos *.test.ts forem adicionados
        # em supabase/functions/**.
        run: |
          deno test --allow-env \
            supabase/functions/_shared/ \
            supabase/functions/kommo-dashboard/

  # E2E (Playwright) fica FORA da CI de propósito: precisa de credenciais
  # reais do Kommo/Supabase que não devem virar secret de CI neste momento.
  # Rodar manualmente (`npm run test:e2e`) antes de releases maiores.
