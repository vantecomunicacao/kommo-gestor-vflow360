# Projeto "Kommo VFlow360 Gestor" (fjncmmqvmocwykpshgsh) — isolado do GHL desde
# 2026-08-02 (infraestrutura própria, não é mais o projeto compartilhado antigo
# xcrfbpyhyznyufijrdry). Só existe schema `kommo` aqui; não há tabelas/functions
# `ghl_*`/`ghl-*` neste projeto.
project_id = "fjncmmqvmocwykpshgsh"

# PostgREST só serve schemas expostos. O app Kommo vive no schema dedicado `kommo`
# (nome mantido por herança do projeto antigo compartilhado; não há mais motivo
# técnico pra não ser `public`, mas renomear agora não compensa o risco/esforço).
# NOTA: isto afeta o stack LOCAL (supabase start). No projeto HOSPEDADO é preciso
# adicionar `kommo` em Dashboard → Settings → API → Exposed schemas.
[api]
schemas = ["public", "graphql_public", "kommo"]
extra_search_path = ["public", "extensions", "kommo"]

# Kommo (M2): sem verify_jwt para o teste de sync. Endurecer auth no M4 (connect/Vault).
[functions.kommo-sync]
verify_jwt = false

# Kommo (M3): dashboard agrega kommo.leads. Faz checagem de membership internamente.
[functions.kommo-dashboard]
verify_jwt = false

# Kommo (M4): conexão (connect/status/disconnect). Exige usuário autenticado internamente.
[functions.kommo-manage]
verify_jwt = false

# Kommo (Fase 1): leads esfriando (schema kommo). Exige usuário autenticado internamente.
[functions.cooling-leads]
verify_jwt = false

[functions.log-event]
verify_jwt = false

# Só usuário (JWT válido + membership, checado internamente por _shared/authorize.ts).
# Nunca cron/anon. Explícito aqui porque a ausência de bloco não bastou pra reverter
# um deploy anterior que foi feito por engano com --no-verify-jwt (2026-08-13).
[functions.kommo-ai-analyze]
verify_jwt = true
