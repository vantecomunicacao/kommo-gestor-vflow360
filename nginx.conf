server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — aplicados em todas as respostas (always).
    #
    # Embed: o painel é carregado dentro do GHL (whitelabel app.vflow360.com.br)
    # via custom-menu-link. X-Frame-Options não permite liberar domínio externo
    # específico, então usamos CSP frame-ancestors no lugar. Este header continua
    # em modo ENFORCE (só frame-ancestors — não quebra nada).
    add_header Content-Security-Policy "frame-ancestors 'self' https://app.vflow360.com.br https://*.gohighlevel.com https://*.leadconnectorhq.com" always;

    # CSP completa em modo REPORT-ONLY (Fase 2.3 do plano de remediação).
    # NÃO bloqueia nada — só registra violações no console do navegador. Serve
    # pra calibrar a política antes de virar enforce. Violações esperadas nesta
    # fase de observação (a corrigir ANTES de trocar por enforce):
    #   - o <script> inline de tema em index.html viola `script-src 'self'` →
    #     adicionar o hash sha256-... dele aqui antes do enforce.
    # (O webhook de erro n8n dedicado — item 1.3 — já está em `connect-src`.)
    # Depois da janela de observação (1–2 semanas, zero falso-positivo), trocar
    # `Content-Security-Policy-Report-Only` por `Content-Security-Policy` e
    # remover o header enforce só-frame-ancestors acima (esta política já cobre).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://fjncmmqvmocwykpshgsh.supabase.co wss://fjncmmqvmocwykpshgsh.supabase.co https://vt-n8n-webhook.wx0qbq.easypanel.host; frame-ancestors 'self' https://app.vflow360.com.br https://*.gohighlevel.com https://*.leadconnectorhq.com; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/javascript text/xml application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;
}
